# dsh-plugin-project-context — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "projectctx".
# Tools resultantes: mcp__projectctx__* (ver README).
- insert:
    - id: mcp-project-context
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: projectctx
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/project-context/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
